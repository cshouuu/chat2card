name: Cloudflare Worker Preview

on:
  push:
    branches:
      - feature/cloudflare-worker-deploy
  workflow_dispatch:

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate parser tests
        run: node --test parser-service/*.test.mjs

      - name: Deploy temporary Cloudflare Worker and smoke test
        shell: bash
        env:
          NO_COLOR: '1'
        run: |
          set -o pipefail
          npx --yes wrangler@latest deploy --temporary 2>&1 | tee cloudflare-deploy.txt
          DEPLOY_STATUS=${PIPESTATUS[0]}
          if [ "$DEPLOY_STATUS" -ne 0 ]; then
            exit "$DEPLOY_STATUS"
          fi
          WORKER_URL=$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' cloudflare-deploy.txt | tail -1 || true)
          echo "" >> cloudflare-deploy.txt
          echo "Extracted Worker URL: $WORKER_URL" >> cloudflare-deploy.txt
          if [ -z "$WORKER_URL" ]; then
            echo "Could not extract Worker URL" >> cloudflare-deploy.txt
            exit 1
          fi
          echo "Smoke test: $WORKER_URL/health" >> cloudflare-deploy.txt
          sleep 5
          curl --retry 5 --retry-delay 2 --retry-all-errors --fail --silent --show-error "$WORKER_URL/health" | tee -a cloudflare-deploy.txt
          echo "" >> cloudflare-deploy.txt

      - name: Upload deployment info
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-deploy-info
          path: cloudflare-deploy.txt
          retention-days: 1
