name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  VITE_PARSER_API: https://chat2card-parser.colorful-paradox.workers.dev

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run frontend unit tests
        run: npm test

      - name: Run parser-service unit tests
        run: node --test parser-service/parsers.test.mjs parser-service/providers/*.test.mjs

      - name: Check production parser health
        run: curl --retry 3 --retry-delay 2 --retry-all-errors --fail --silent --show-error "$VITE_PARSER_API/health"

      - name: Type check & build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # 自动启用仓库的 GitHub Pages,无需手动去 Settings 开启
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
