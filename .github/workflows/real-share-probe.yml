name: Real Share Probe

on:
  push:
    branches: [fix/chatgpt-share-403]
  workflow_dispatch:

jobs:
  real-share-parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Parse all five real public shares
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { parsePublicShare } from './parser-service/parse-share.mjs';

          const cases = [
            ['chatgpt', 'https://chatgpt.com/s/t_6a7c19e737f88191a89f811d7976c18f'],
            ['deepseek', 'https://chat.deepseek.com/share/yr7r5ogtich73zqhhn'],
            ['doubao', 'https://www.doubao.com/thread/xHnWxp02eroYtbFwR'],
            ['gemini', 'https://share.gemini.google/etOFajKjXapO'],
            ['claude', 'https://claude.ai/share/5c870dee-553c-4133-b4ea-70d2c49063ff'],
          ];

          const summaries = [];
          for (const [provider, url] of cases) {
            const parsed = await parsePublicShare(url);
            if (!Array.isArray(parsed.messages) || parsed.messages.length === 0) {
              throw new Error(`${provider}: no messages parsed`);
            }
            for (const message of parsed.messages) {
              if (!['user', 'assistant'].includes(message.role)) {
                throw new Error(`${provider}: unsupported role ${message.role}`);
              }
              if (Object.hasOwn(message, 'thinking_content') || Object.hasOwn(message, 'reasoning')) {
                throw new Error(`${provider}: reasoning field leaked into normalized message`);
              }
            }
            const attachments = parsed.messages.flatMap((m) => m.attachments || []);
            summaries.push({
              provider,
              ok: true,
              messages: parsed.messages.length,
              attachments: attachments.length,
              images: attachments.filter((a) => a.type === 'image').length,
              files: attachments.filter((a) => a.type === 'file').length,
              hiddenAttachments: attachments.filter((a) => a.hidden).length,
              title: Boolean(parsed.title),
            });
          }

          const byProvider = Object.fromEntries(summaries.map((x) => [x.provider, x]));
          if (byProvider.chatgpt.messages !== 2) throw new Error(`ChatGPT expected 2 messages, got ${byProvider.chatgpt.messages}`);
          if (byProvider.deepseek.messages !== 2) throw new Error(`DeepSeek expected 2 messages, got ${byProvider.deepseek.messages}`);
          if (byProvider.doubao.messages !== 2) throw new Error(`Doubao expected 2 messages, got ${byProvider.doubao.messages}`);
          if (byProvider.gemini.messages !== 4) throw new Error(`Gemini expected 4 messages, got ${byProvider.gemini.messages}`);
          if (byProvider.gemini.images < 2) throw new Error(`Gemini expected at least 2 image attachments, got ${byProvider.gemini.images}`);

          // Only structural summaries are printed; conversation bodies are intentionally omitted.
          console.log(JSON.stringify(summaries, null, 2));
          NODE

      - name: Verify frontend tests and production build
        run: |
          npm ci
          npm test
          node --test parser-service/parsers.test.mjs parser-service/providers/*.test.mjs
          npm run build
