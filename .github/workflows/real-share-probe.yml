name: Real Share Probe

on:
  push:
    branches: [fix/chatgpt-share-403]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch real share samples
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe
          fetch_md() { curl -L -sS -H 'X-No-Cache: true' -o "probe/$1.md" "https://r.jina.ai/$2"; }
          fetch_html() { curl -L -sS -H 'X-Engine: curl' -H 'X-Respond-With: html' -H 'X-Respond-Timing: html' -H 'X-No-Cache: true' -o "probe/$1.html" "https://r.jina.ai/$2"; }
          fetch_html chatgpt 'https://chatgpt.com/s/t_6a7c19e737f88191a89f811d7976c18f'
          fetch_md deepseek 'https://chat.deepseek.com/share/yr7r5ogtich73zqhhn'
          fetch_md doubao 'https://www.doubao.com/thread/xHnWxp02eroYtbFwR'
          fetch_md claude 'https://claude.ai/share/5c870dee-553c-4133-b4ea-70d2c49063ff'
          fetch_html gemini-html 'https://share.gemini.google/etOFajKjXapO'
          curl -sS -D probe/gemini-short.headers -o /dev/null 'https://share.gemini.google/etOFajKjXapO' || true

      - name: Probe Gemini canonical URL and RPC
        shell: bash
        run: |
          set -euo pipefail
          SHARE_ID='804a0cecab4b'
          CANONICAL="https://gemini.google.com/share/${SHARE_ID}"

          canonical_code=$(curl -sS -o probe/gemini-worker-canonical.json -w '%{http_code}' \
            'https://chat2card-parser.colorful-paradox.workers.dev/parse' \
            -H 'content-type: application/json' \
            --data "{\"url\":\"${CANONICAL}\"}" || true)
          echo "gemini canonical worker status=${canonical_code} bytes=$(wc -c < probe/gemini-worker-canonical.json)"

          python - <<'PY' > probe/gemini-freq.txt
          import json
          sid='804a0cecab4b'
          inner=json.dumps([None,sid,[4]], separators=(',',':'))
          freq=json.dumps([[['ujx1Bf',inner,None,'generic']]], separators=(',',':'))
          print(freq)
          PY
          FREQ=$(cat probe/gemini-freq.txt)
          rpc_code=$(curl -sS -o probe/gemini-rpc.txt -D probe/gemini-rpc.headers -w '%{http_code}' \
            'https://gemini.google.com/_/BardChatUi/data/batchexecute?rpcids=ujx1Bf&source-path=%2Fshare%2F804a0cecab4b&rt=c' \
            -H 'content-type: application/x-www-form-urlencoded;charset=UTF-8' \
            -H 'accept-language: en-US,en;q=0.9' \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150 Safari/537.36' \
            --data-urlencode "f.req=${FREQ}" || true)
          echo "gemini rpc status=${rpc_code} bytes=$(wc -c < probe/gemini-rpc.txt)"

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { parseGeminiBatchExecute } from './parser-service/parsers.mjs';
          try {
            const parsed = parseGeminiBatchExecute(fs.readFileSync('probe/gemini-rpc.txt','utf8'));
            fs.writeFileSync('probe/gemini-rpc-parsed.json', JSON.stringify(parsed,null,2));
            console.log(JSON.stringify({geminiRpcParsed:true,messages:parsed.messages.length,title:Boolean(parsed.title)}));
          } catch (e) {
            console.log(JSON.stringify({geminiRpcParsed:false,error:String(e?.message||e)}));
          }
          NODE

      - name: Probe existing parsers
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { parseChatGptHtml } from './parser-service/parsers.mjs';
          const parsed = parseChatGptHtml(fs.readFileSync('probe/chatgpt.html','utf8'));
          fs.writeFileSync('probe/chatgpt-parsed.json', JSON.stringify(parsed,null,2));
          console.log(JSON.stringify({chatgpt:true,messages:parsed.messages.length,title:Boolean(parsed.title)}));
          NODE

      - name: Upload probe samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-share-probe
          path: probe
          retention-days: 1
