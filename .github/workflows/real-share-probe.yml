name: Real Share Probe

on:
  push:
    branches: [fix/chatgpt-share-403]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probe Jina structured and browser fallbacks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe

          # DeepSeek public JSON endpoint through Jina, for browser-safe CORS proxying.
          curl -sS -D probe/deepseek-jina.headers -o probe/deepseek-jina.txt \
            -H 'X-No-Cache: true' \
            'https://r.jina.ai/https://chat.deepseek.com/api/v0/share/content?share_id=yr7r5ogtich73zqhhn' || true
          echo "deepseek-jina bytes=$(wc -c < probe/deepseek-jina.txt) status=$(head -1 probe/deepseek-jina.headers)"

          # Jina browser engine: check whether fully-rendered public pages retain user/assistant structure.
          for entry in \
            'doubao|https://www.doubao.com/thread/xHnWxp02eroYtbFwR' \
            'gemini|https://gemini.google.com/share/804a0cecab4b'; do
            name="${entry%%|*}"; url="${entry#*|}"
            curl -sS -D "probe/${name}-jina-browser.headers" -o "probe/${name}-jina-browser.md" \
              -H 'X-Engine: browser' \
              -H 'X-No-Cache: true' \
              "https://r.jina.ai/${url}" || true
            echo "${name}-jina-browser bytes=$(wc -c < probe/${name}-jina-browser.md) status=$(head -1 probe/${name}-jina-browser.headers)"
          done

      - name: Probe Doubao structured API directly
        shell: bash
        run: |
          set -euo pipefail
          URL='https://www.doubao.com/im/message/share/get?aid=497858&device_platform=web&samantha_web=1'
          curl -sS -D probe/doubao-api.headers -o probe/doubao-api.json "$URL" \
            -X POST \
            -H 'content-type: application/json; encoding=utf-8' \
            -H 'origin: https://www.doubao.com' \
            -H 'referer: https://www.doubao.com/thread/xHnWxp02eroYtbFwR' \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150 Safari/537.36' \
            --data '{"share_id":"xHnWxp02eroYtbFwR","need_bot_info":true}' || true
          echo "doubao-api bytes=$(wc -c < probe/doubao-api.json) status=$(head -1 probe/doubao-api.headers)"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          try {
            const j=JSON.parse(fs.readFileSync('probe/doubao-api.json','utf8'));
            const list=j?.data?.message_snapshot?.message_list;
            console.log(JSON.stringify({code:j?.code,messages:Array.isArray(list)?list.length:0,title:j?.data?.share_info?.share_name||null}));
          } catch(e) { console.log(JSON.stringify({doubaoJson:false,error:String(e?.message||e)})); }
          NODE

      - name: Probe Gemini RPC through Jina browser page
        shell: bash
        run: |
          set -euo pipefail
          # Keep a direct control sample proving the public RPC remains decodable from a normal server egress.
          python - <<'PY' > probe/gemini-freq.txt
          import json
          sid='804a0cecab4b'
          inner=json.dumps([None,sid,[4]], separators=(',',':'))
          print(json.dumps([[['ujx1Bf',inner,None,'generic']]], separators=(',',':')))
          PY
          FREQ=$(cat probe/gemini-freq.txt)
          curl -sS -D probe/gemini-rpc.headers -o probe/gemini-rpc.txt \
            'https://gemini.google.com/_/BardChatUi/data/batchexecute?rpcids=ujx1Bf&source-path=%2Fshare%2F804a0cecab4b&rt=c' \
            -H 'content-type: application/x-www-form-urlencoded;charset=UTF-8' \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150 Safari/537.36' \
            --data-urlencode "f.req=${FREQ}" || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { parseGeminiBatchExecute } from './parser-service/parsers.mjs';
          try {
            const p=parseGeminiBatchExecute(fs.readFileSync('probe/gemini-rpc.txt','utf8'));
            console.log(JSON.stringify({gemini:true,messages:p.messages.length,title:Boolean(p.title),attachments:p.messages.reduce((n,m)=>n+(m.attachments?.length||0),0)}));
          } catch(e) { console.log(JSON.stringify({gemini:false,error:String(e?.message||e)})); }
          NODE

      - name: Upload probe samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-share-probe
          path: probe
          retention-days: 1
