name: ChatGPT Share Probe

on:
  push:
    branches:
      - fix/chatgpt-share-403
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install curl_cffi
        run: pip install --disable-pip-version-check curl_cffi

      - name: Probe real ChatGPT share URL
        shell: bash
        run: |
          set -euo pipefail
          URL='https://chatgpt.com/s/t_6a7c19e737f88191a89f811d7976c18f'
          {
            echo '=== curl direct ==='
            curl -L -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/150 Safari/537.36' -sS -D direct.headers -o direct.html -w 'status=%{http_code} size=%{size_download} final=%{url_effective}\n' "$URL" || true
            echo "body_bytes=$(wc -c < direct.html 2>/dev/null || echo 0)"
            echo

            echo '=== Jina Reader default ==='
            curl -L -sS -D jina.headers -o jina.txt -w 'status=%{http_code} size=%{size_download} final=%{url_effective}\n' "https://r.jina.ai/$URL" || true
            echo "body_bytes=$(wc -c < jina.txt 2>/dev/null || echo 0)"
            head -60 jina.txt || true
            echo

            echo '=== Jina Reader browser/network-idle ==='
            curl -L -sS \
              -H 'X-Engine: browser' \
              -H 'X-Timeout: 30' \
              -H 'X-Respond-Timing: network-idle' \
              -H 'X-No-Cache: true' \
              -D jina-browser.headers -o jina-browser.txt \
              -w 'status=%{http_code} size=%{size_download} final=%{url_effective}\n' \
              "https://r.jina.ai/$URL" || true
            echo "body_bytes=$(wc -c < jina-browser.txt 2>/dev/null || echo 0)"
            head -100 jina-browser.txt || true
            echo

            echo '=== curl_cffi chrome impersonation ==='
            python - <<'PY'
          from curl_cffi import requests
          url = 'https://chatgpt.com/s/t_6a7c19e737f88191a89f811d7976c18f'
          try:
              r = requests.get(url, impersonate='chrome', timeout=30, headers={'Accept-Language':'en-US,en;q=0.9'})
              print('status=', r.status_code, 'bytes=', len(r.content), 'final=', r.url)
              open('cffi.html','wb').write(r.content)
          except Exception as e:
              print('ERROR', repr(e))
          PY
          } | tee probe.txt

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-share-probe
          path: |
            probe.txt
            direct.headers
            direct.html
            jina.headers
            jina.txt
            jina-browser.headers
            jina-browser.txt
            cffi.html
          if-no-files-found: ignore
          retention-days: 1
