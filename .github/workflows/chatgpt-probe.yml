name: ChatGPT Share Probe

on:
  push:
    branches:
      - fix/chatgpt-share-403
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Jina raw HTML browser CORS
        shell: bash
        run: |
          set -euo pipefail
          TARGET='https://r.jina.ai/https://chatgpt.com/s/t_6a7c19e737f88191a89f811d7976c18f'
          ORIGIN='https://cshouuu.github.io'
          {
            echo '=== CORS preflight ==='
            curl -sS -D - -o /dev/null -X OPTIONS "$TARGET" \
              -H "Origin: $ORIGIN" \
              -H 'Access-Control-Request-Method: GET' \
              -H 'Access-Control-Request-Headers: x-engine,x-respond-with,x-respond-timing,x-no-cache'
            echo
            echo '=== Browser-shaped GET ==='
            curl -sS -D cors-get.headers -o cors-get.html "$TARGET" \
              -H "Origin: $ORIGIN" \
              -H 'X-Engine: curl' \
              -H 'X-Respond-With: html' \
              -H 'X-Respond-Timing: html' \
              -H 'X-No-Cache: true'
            grep -Ei '^(access-control|vary|content-type|HTTP/)' cors-get.headers || true
            echo "body_bytes=$(wc -c < cors-get.html)"
            echo "turbo_chunks=$(grep -o 'streamController.enqueue' cors-get.html | wc -l || true)"
          } | tee probe.txt

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-share-probe
          path: |
            probe.txt
            cors-get.headers
            cors-get.html
          if-no-files-found: ignore
          retention-days: 1
